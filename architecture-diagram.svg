<svg width="1000" height="660" viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-planned" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#a32d2d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <text x="40" y="34" font-size="18" font-weight="600" fill="#2c2c2a">PesaFlow — target architecture</text>
  <text x="40" y="54" font-size="12" fill="#5f5e5a">Current implementation plus the intended Daraja and notification flow</text>

  <line x1="40" y1="76" x2="70" y2="76" stroke="#5f5e5a" stroke-width="1.4"/>
  <text x="78" y="80" font-size="11" fill="#5f5e5a">Implemented</text>
  <line x1="180" y1="76" x2="210" y2="76" stroke="#888780" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="218" y="80" font-size="11" fill="#5f5e5a">Planned / not yet built</text>

  <!-- Client -->
  <rect x="40" y="140" width="130" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="1"/>
  <text x="105" y="163" font-size="13" font-weight="600" text-anchor="middle" fill="#2c2c2a">Client</text>
  <text x="105" y="180" font-size="10.5" text-anchor="middle" fill="#5f5e5a">Postman / mobile app</text>

  <!-- Payment Service -->
  <rect x="230" y="110" width="230" height="116" rx="12" fill="#eeedfe" stroke="#534ab7" stroke-width="1"/>
  <text x="248" y="136" font-size="14" font-weight="600" fill="#26215c">payment-service</text>
  <text x="248" y="152" font-size="10.5" fill="#3c3489">port 8080</text>
  <rect x="248" y="164" width="196" height="24" rx="5" fill="#ffffff" stroke="#7f77dd" stroke-width="0.8"/>
  <text x="256" y="180" font-size="10" fill="#26215c">Payment CRUD + validation</text>
  <rect x="248" y="192" width="196" height="24" rx="5" fill="#ffffff" stroke="#7f77dd" stroke-width="0.8"/>
  <text x="256" y="208" font-size="10" fill="#26215c">H2 (payments)</text>

  <!-- Daraja API (external, planned) -->
  <rect x="560" y="60" width="220" height="90" rx="12" fill="#f1efe8" stroke="#888780" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="578" y="86" font-size="14" font-weight="600" fill="#2c2c2a">Safaricom Daraja API</text>
  <text x="578" y="103" font-size="10.5" fill="#5f5e5a">External — STK Push sandbox</text>
  <text x="578" y="120" font-size="10.5" fill="#5f5e5a">Not integrated yet</text>

  <!-- Wallet Service -->
  <rect x="230" y="330" width="230" height="116" rx="12" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
  <text x="248" y="356" font-size="14" font-weight="600" fill="#04342c">wallet-service</text>
  <text x="248" y="372" font-size="10.5" fill="#085041">port 8081</text>
  <rect x="248" y="384" width="196" height="24" rx="5" fill="#ffffff" stroke="#5dcaa5" stroke-width="0.8"/>
  <text x="256" y="400" font-size="10" fill="#04342c">Balance + insufficient-funds guard</text>
  <rect x="248" y="412" width="196" height="24" rx="5" fill="#ffffff" stroke="#5dcaa5" stroke-width="0.8"/>
  <text x="256" y="428" font-size="10" fill="#04342c">H2 (wallets, wallet_transactions)</text>

  <!-- Notification Service (planned) -->
  <rect x="560" y="330" width="230" height="116" rx="12" fill="#faece7" stroke="#d85a30" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="578" y="356" font-size="14" font-weight="600" fill="#4a1b0c">notification-service</text>
  <text x="578" y="372" font-size="10.5" fill="#712b13">port 8082 — planned</text>
  <rect x="578" y="384" width="196" height="24" rx="5" fill="#ffffff" stroke="#f0997b" stroke-width="0.8"/>
  <text x="586" y="400" font-size="10" fill="#4a1b0c">SMS / confirmation on payment result</text>
  <rect x="578" y="412" width="196" height="24" rx="5" fill="#ffffff" stroke="#f0997b" stroke-width="0.8"/>
  <text x="586" y="428" font-size="10" fill="#4a1b0c">Not built yet</text>

  <!-- Client -> payment-service : implemented -->
  <line x1="170" y1="168" x2="226" y2="168" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="172" y="160" font-size="10.5" fill="#5f5e5a">POST /api/payments</text>

  <!-- payment-service -> Daraja : planned STK push -->
  <path d="M460,140 C500,120 520,110 556,100" fill="none" stroke="#888780" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-planned)"/>
  <text x="466" y="118" font-size="10" fill="#5f5e5a">STK Push request</text>

  <!-- Daraja -> payment-service : planned callback -->
  <path d="M556,132 C520,150 500,160 462,180" fill="none" stroke="#888780" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-planned)"/>
  <text x="466" y="200" font-size="10" fill="#5f5e5a">Callback → /api/payments/callback</text>

  <!-- payment-service -> wallet-service : implemented -->
  <line x1="345" y1="226" x2="345" y2="326" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="352" y="280" font-size="10.5" fill="#5f5e5a">POST /api/wallets/credit</text>

  <!-- wallet-service down -> FAILED : implemented failure path -->
  <path d="M280,330 C260,300 260,255 280,228" fill="none" stroke="#a32d2d" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
  <text x="150" y="290" font-size="10" fill="#a32d2d">unreachable →</text>
  <text x="150" y="303" font-size="10" fill="#a32d2d">payment marked FAILED</text>

  <!-- payment-service -> notification-service : planned -->
  <path d="M460,180 C560,220 640,260 675,326" fill="none" stroke="#888780" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-planned)"/>
  <text x="486" y="240" font-size="10" fill="#5f5e5a">Notify on payment result — planned</text>

  <!-- Notes -->
  <text x="40" y="500" font-size="12" font-weight="600" fill="#2c2c2a">Notes</text>
  <text x="40" y="522" font-size="11" fill="#444441">- Client, payment-service, wallet-service and the payment to wallet credit call are built and tested end to end.</text>
  <text x="40" y="540" font-size="11" fill="#444441">- Daraja STK Push, the payment callback endpoint, and notification-service are the next milestones - not built yet.</text>
  <text x="40" y="558" font-size="11" fill="#444441">- Each service owns its own database; no shared schema, no shared code at runtime.</text>
  <text x="40" y="576" font-size="11" fill="#444441">- A failed wallet call marks the payment FAILED rather than leaving it as a false SUCCESS.</text>
  <text x="40" y="594" font-size="11" fill="#444441">- Once Daraja is wired in, the STK push becomes asynchronous: payment starts PENDING and only</text>
  <text x="40" y="610" font-size="11" fill="#444441">  moves to SUCCESS/FAILED when Safaricom's callback arrives, not immediately on request.</text>
</svg>
