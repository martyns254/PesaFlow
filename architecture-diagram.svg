<svg width="1000" height="680" viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-planned" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#a32d2d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>

  <text x="40" y="34" font-size="18" font-weight="600" fill="#2c2c2a">PesaFlow — architecture</text>
  <text x="40" y="54" font-size="12" fill="#5f5e5a">Daraja STK Push and async callback are now implemented and tested end to end</text>

  <line x1="40" y1="76" x2="70" y2="76" stroke="#5f5e5a" stroke-width="1.4"/>
  <text x="78" y="80" font-size="11" fill="#5f5e5a">Implemented</text>
  <line x1="180" y1="76" x2="210" y2="76" stroke="#888780" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="218" y="80" font-size="11" fill="#5f5e5a">Planned / not yet built</text>

  <!-- Client -->
  <rect x="40" y="140" width="130" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="1"/>
  <text x="105" y="163" font-size="13" font-weight="600" text-anchor="middle" fill="#2c2c2a">Client</text>
  <text x="105" y="180" font-size="10.5" text-anchor="middle" fill="#5f5e5a">Postman / mobile app</text>

  <!-- Payment Service -->
  <rect x="230" y="100" width="230" height="140" rx="12" fill="#eeedfe" stroke="#534ab7" stroke-width="1"/>
  <text x="248" y="126" font-size="14" font-weight="600" fill="#26215c">payment-service</text>
  <text x="248" y="142" font-size="10.5" fill="#3c3489">port 8080 · API key required</text>
  <rect x="248" y="152" width="196" height="24" rx="5" fill="#ffffff" stroke="#7f77dd" stroke-width="0.8"/>
  <text x="256" y="168" font-size="10" fill="#26215c">POST /api/payments → PENDING</text>
  <rect x="248" y="180" width="196" height="24" rx="5" fill="#ffffff" stroke="#7f77dd" stroke-width="0.8"/>
  <text x="256" y="196" font-size="10" fill="#26215c">POST /api/payments/callback (open)</text>
  <rect x="248" y="208" width="196" height="24" rx="5" fill="#ffffff" stroke="#7f77dd" stroke-width="0.8"/>
  <text x="256" y="224" font-size="10" fill="#26215c">H2 (payments)</text>

  <!-- Daraja API (external, now implemented) -->
  <rect x="560" y="60" width="220" height="90" rx="12" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
  <text x="578" y="86" font-size="14" font-weight="600" fill="#04342c">Safaricom Daraja API</text>
  <text x="578" y="103" font-size="10.5" fill="#085041">Sandbox — OAuth + STK Push</text>
  <text x="578" y="120" font-size="10.5" fill="#085041">Implemented and tested</text>

  <!-- Wallet Service -->
  <rect x="230" y="330" width="230" height="116" rx="12" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
  <text x="248" y="356" font-size="14" font-weight="600" fill="#04342c">wallet-service</text>
  <text x="248" y="372" font-size="10.5" fill="#085041">port 8081 · API key required</text>
  <rect x="248" y="384" width="196" height="24" rx="5" fill="#ffffff" stroke="#5dcaa5" stroke-width="0.8"/>
  <text x="256" y="400" font-size="10" fill="#04342c">Balance + insufficient-funds guard</text>
  <rect x="248" y="412" width="196" height="24" rx="5" fill="#ffffff" stroke="#5dcaa5" stroke-width="0.8"/>
  <text x="256" y="428" font-size="10" fill="#04342c">H2 (wallets, wallet_transactions)</text>

  <!-- Notification Service (still planned) -->
  <rect x="560" y="330" width="230" height="116" rx="12" fill="#faece7" stroke="#d85a30" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="578" y="356" font-size="14" font-weight="600" fill="#4a1b0c">notification-service</text>
  <text x="578" y="372" font-size="10.5" fill="#712b13">port 8082 — planned</text>
  <rect x="578" y="384" width="196" height="24" rx="5" fill="#ffffff" stroke="#f0997b" stroke-width="0.8"/>
  <text x="586" y="400" font-size="10" fill="#4a1b0c">SMS / confirmation on payment result</text>
  <rect x="578" y="412" width="196" height="24" rx="5" fill="#ffffff" stroke="#f0997b" stroke-width="0.8"/>
  <text x="586" y="428" font-size="10" fill="#4a1b0c">Not built yet</text>

  <!-- Client -> payment-service -->
  <line x1="170" y1="168" x2="226" y2="150" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="172" y="140" font-size="10.5" fill="#5f5e5a">1. POST /api/payments</text>

  <!-- payment-service -> Daraja : STK push -->
  <path d="M460,140 C500,120 520,110 556,100" fill="none" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="466" y="118" font-size="10" fill="#5f5e5a">2. STK Push request</text>

  <!-- Daraja -> payment-service : callback -->
  <path d="M556,132 C520,150 500,160 462,180" fill="none" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="466" y="198" font-size="10" fill="#5f5e5a">4. Callback (async, ~1-2 min later)</text>

  <!-- payment-service -> wallet-service : implemented, only on success -->
  <line x1="345" y1="240" x2="345" y2="326" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="352" y="290" font-size="10.5" fill="#5f5e5a">5. Credit wallet</text>
  <text x="352" y="304" font-size="10" fill="#5f5e5a">only if ResultCode = 0</text>

  <!-- wallet-service down -> FAILED -->
  <path d="M280,330 C260,300 260,265 280,242" fill="none" stroke="#a32d2d" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
  <text x="150" y="300" font-size="10" fill="#a32d2d">unreachable →</text>
  <text x="150" y="313" font-size="10" fill="#a32d2d">payment marked FAILED</text>

  <!-- payment-service -> notification-service : planned -->
  <path d="M460,190 C560,230 640,270 675,326" fill="none" stroke="#888780" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-planned)"/>
  <text x="486" y="250" font-size="10" fill="#5f5e5a">Notify on result — planned</text>

  <!-- Notes -->
  <text x="40" y="500" font-size="12" font-weight="600" fill="#2c2c2a">Notes</text>
  <text x="40" y="522" font-size="11" fill="#444441">- Payment flow is asynchronous: step 1 returns immediately with status PENDING; steps 2-5 happen</text>
  <text x="40" y="538" font-size="11" fill="#444441">  in the background, resolved only when Daraja's callback (step 4) arrives, typically 30-90+ seconds later.</text>
  <text x="40" y="556" font-size="11" fill="#444441">- The wallet is credited only after ResultCode = 0 is confirmed in the callback - never optimistically.</text>
  <text x="40" y="574" font-size="11" fill="#444441">- The callback endpoint is intentionally left open (no API key), since Safaricom cannot send our custom</text>
  <text x="40" y="590" font-size="11" fill="#444441">  header. Every other endpoint on both services requires X-API-KEY.</text>
  <text x="40" y="608" font-size="11" fill="#444441">- CheckoutRequestID is stored on the Payment row at STK Push time and used to match the later callback</text>
  <text x="40" y="624" font-size="11" fill="#444441">  back to the correct payment - the two are separate HTTP requests, seconds to minutes apart.</text>
  <text x="40" y="642" font-size="11" fill="#444441">- Each service still owns its own database; no shared schema, no shared code at runtime.</text>
</svg>
